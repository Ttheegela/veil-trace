<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -80 1200 800" role="img" aria-label="The sanctions system. A list is a signal: it bites only when a bank, a distributor or a shipper recognises the name and refuses." font-family='"IBM Plex Sans Variable", "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif'>
<title>The sanctions system</title>
<style>
