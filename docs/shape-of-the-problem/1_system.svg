.linfo{fill:none;stroke:#1f5fd1;stroke-width:2.6;stroke-dasharray:1.5 6;stroke-linecap:round}
.lrisk{fill:none;stroke:#8f5600;stroke-width:2.4}
.lharm{fill:none;stroke:#0f1b2d;stroke-width:2.4;stroke-dasharray:14 5 3 5}
.ln{fill:none;stroke:#4a5a70;stroke-width:2}
.lnthin{fill:none;stroke:#7d8ba1;stroke-width:1.2}
.lamb{fill:none;stroke:#8f5600;stroke-width:2;stroke-dasharray:7 5}
.lacc{fill:none;stroke:#1f5fd1;stroke-width:2.2}
.lteal{fill:none;stroke:#0f7c8c;stroke-width:2.4}
.fgoods{fill:#0f1b2d}
.fmoney{fill:#0f7c8c}
.finfo{fill:#1f5fd1}
.frisk{fill:#8f5600}
.fmfg{fill:#4a5a70}
.fteal{fill:#0f7c8c}
.facc{fill:#1f5fd1}
.famb{fill:#8f5600}
.fpos{fill:#0f7a4a}
.fborder{fill:#7d8ba1}
.band{fill:#1f5fd1}
.bandL{fill:#e8effc;stroke:#1f5fd1;stroke-width:1.2;stroke-dasharray:4 3}
.listband{fill:#e8effc;stroke:#1f5fd1;stroke-width:1.2}
.barAmb{fill:#8f5600}
