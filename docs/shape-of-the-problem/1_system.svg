.tcap{fill:#a3b1c6}
.tacc{fill:#7fa8ff}
.tteal{fill:#4fd1c5}
.tamb{fill:#f2b84b}
.tpos{fill:#4cc98a}
.tinv{fill:#121b2d}
.tnum{fill:#121b2d}
.box{fill:#121b2d;stroke:#5f6e87}
.boxm{fill:#1a2438;stroke:#5f6e87}
.boxacc{fill:#17274a;stroke:#7fa8ff}
.boxteal{fill:#10302f;stroke:#4fd1c5}
.boxamb{fill:#2f2512;stroke:#f2b84b}
.boxambs{fill:#2f2512;stroke:#f2b84b}
.boxpos{fill:#10301f;stroke:#4cc98a}
.zone{fill:#1a2438;stroke:#5f6e87}
.lgoods{stroke:#e8eef7}
.lmoney{stroke:#4fd1c5}
.linfo{stroke:#7fa8ff}
.lrisk{stroke:#f2b84b}
.lharm{stroke:#e8eef7}
.ln{stroke:#a3b1c6}
.lnthin{stroke:#5f6e87}
.lamb{stroke:#f2b84b}
.lacc{stroke:#7fa8ff}
.lteal{stroke:#4fd1c5}
.fgoods{fill:#e8eef7}
.fmoney{fill:#4fd1c5}
.finfo{fill:#7fa8ff}
.frisk{fill:#f2b84b}
.fmfg{fill:#a3b1c6}
.fteal{fill:#4fd1c5}
.facc{fill:#7fa8ff}
.famb{fill:#f2b84b}
.fpos{fill:#4cc98a}
.fborder{fill:#5f6e87}
.band{fill:#7fa8ff}
.bandL{fill:#17274a;stroke:#7fa8ff}
.listband{fill:#17274a;stroke:#7fa8ff}
.barAmb{fill:#f2b84b}
.barMfg{fill:#a3b1c6}
.barTeal{fill:#4fd1c5}
.hatchbg{fill:#1a2438}
.hatchln{stroke:#a3b1c6}
.hatchbox{stroke:#a3b1c6}
}
</style>
<defs><marker id="d1_goods" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L10 5 L0 10 z" class="fgoods"/></marker><marker id="d1_money" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L10 5 L0 10 z" class="fmoney"/></marker><marker id="d1_info" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L10 5 L0 10 z" class="finfo"/></marker><marker id="d1_risk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L10 5 L0 10 z" class="frisk"/></marker><marker id="d1_harm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L10 5 L0 10 z" class="fgoods"/></marker><marker id="d1_n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L10 5 L0 10 z" class="fmfg"/></marker><marker id="d1_acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L10 5 L0 10 z" class="facc"/></marker><marker id="d1_amb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L10 5 L0 10 z" class="famb"/></marker><marker id="d1_teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L10 5 L0 10 z" class="fteal"/></marker><pattern id="d1_hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="9" height="9" class="hatchbg"/><line x1="0" y1="0" x2="0" y2="9" class="hatchln"/></pattern></defs>
<rect x="0" y="-80" width="1200" height="800" rx="0" class="bg"/><text x="40" y="-34" class="th">The sanctions system</text>
<rect x="330" y="20" width="540" height="118" rx="8" class="boxacc"/>
<text x="600" y="50" class="tb" text-anchor="middle">Governments and their lists</text>
<rect x="320.0" y="68" width="56" height="32" rx="6" class="box"/>
<text x="348.0" y="89" class="t" text-anchor="middle">UN</text>
<rect x="386.0" y="68" width="176" height="32" rx="6" class="box"/>
<text x="474.0" y="89" class="t" text-anchor="middle">US Treasury (OFAC)</text>
<rect x="572.0" y="68" width="176" height="32" rx="6" class="box"/>
<text x="660.0" y="89" class="t" text-anchor="middle">US Commerce (BIS)</text>
<rect x="758.0" y="68" width="56" height="32" rx="6" class="box"/>
<text x="786.0" y="89" class="t" text-anchor="middle">UK</text>
<rect x="824.0" y="68" width="56" height="32" rx="6" class="box"/>
<text x="852.0" y="89" class="t" text-anchor="middle">EU</text>
<text x="600" y="124" class="ts" text-anchor="middle">name companies, people, ships</text>
<text x="900" y="50" class="tacc" text-anchor="start">Lists stop nothing on their own.</text>
<text x="900" y="69" class="ts" text-anchor="start">They work only when a refuser</text>
<text x="900" y="88" class="ts" text-anchor="start">recognises the name and says no.</text>
<rect x="445" y="225" width="220" height="70" rx="8" class="boxacc"/>
<text x="555.0" y="255.5" class="tb" text-anchor="middle">Banks</text>
<text x="555.0" y="274.5" class="ts" text-anchor="middle">refuse to move money</text>
<rect x="745" y="225" width="280" height="70" rx="8" class="boxacc"/>
<text x="885.0" y="255.5" class="tb" text-anchor="middle">Shippers and insurers</text>
<text x="885.0" y="274.5" class="ts" text-anchor="middle">refuse to carry or cover</text>
<text x="40" y="238" class="tacc" text-anchor="start">The refusers</text>
<text x="40" y="257" class="ts" text-anchor="start">check every deal against</text>
<text x="40" y="276" class="ts" text-anchor="start">the lists</text>
<rect x="560" y="360" width="270" height="170" rx="12" class="zone"/>
<text x="695" y="518" class="ts" text-anchor="middle">Middle country, e.g. Kyrgyzstan, UAE</text>
<rect x="30" y="395" width="190" height="84" rx="8" class="box"/>
<text x="125.0" y="432.5" class="tb" text-anchor="middle">Makers</text>
<text x="125.0" y="451.5" class="ts" text-anchor="middle">e.g. chip makers</text>
<rect x="290" y="395" width="210" height="84" rx="8" class="boxacc"/>
<text x="395" y="425" class="tb" text-anchor="middle">Exporters and</text>
<text x="395" y="445" class="tb" text-anchor="middle">distributors</text>
<text x="395" y="465" class="ts" text-anchor="middle">refuse to sell</text>
<rect x="590" y="395" width="210" height="84" rx="8" class="box"/>
<text x="695.0" y="432.5" class="tb" text-anchor="middle">Middle firm</text>
<text x="695.0" y="451.5" class="ts" text-anchor="middle">buys and passes on</text>
<rect x="960" y="395" width="210" height="84" rx="8" class="box"/>
<text x="1065.0" y="432.5" class="tb" text-anchor="middle">Russian buyer</text>
<text x="1065.0" y="451.5" class="ts" text-anchor="middle">e.g. a weapons-industry firm</text>
<path d="M220 423 L286 423" class="lgoods" marker-end="url(#d1_goods)"/>
<path d="M500 423 L586 423" class="lgoods" marker-end="url(#d1_goods)"/>
<path d="M800 423 L956 423" class="lgoods" marker-end="url(#d1_goods)"/>
<path d="M956 455 L804 455" class="lmoney" marker-end="url(#d1_money)"/>
<path d="M586 455 L504 455" class="lmoney" marker-end="url(#d1_money)"/>
<path d="M286 455 L224 455" class="lmoney" marker-end="url(#d1_money)"/>
<path d="M420 138 L400 391" class="linfo" marker-end="url(#d1_info)"/>
<path d="M555 138 L555 221" class="linfo" marker-end="url(#d1_info)"/>
<path d="M800 138 L860 221" class="linfo" marker-end="url(#d1_info)"/>
<text x="396" y="300" class="tacc" text-anchor="end">lists</text>
<path d="M555 295 L555 447" class="lacc"/>
<rect x="545" y="447" width="20" height="16" rx="3" class="boxacc"/>
<path d="M885 295 L885 415" class="lacc"/>
<rect x="875" y="415" width="20" height="16" rx="3" class="boxacc"/>
<text x="565" y="330" class="ts" text-anchor="start">checks the payment</text>
<text x="895" y="330" class="ts" text-anchor="start">checks the cargo</text>
<text x="40" y="560" class="tamb" text-anchor="start">The gap: a middle firm that is new or unlisted gives the refusers no name to match.</text>
<path d="M40 605 L92 605" class="lgoods" marker-end="url(#d1_goods)"/>
<text x="104" y="610" class="t" text-anchor="start">Goods</text>
<path d="M186.0 605 L238.0 605" class="lmoney" marker-end="url(#d1_money)"/>
<text x="250.0" y="610" class="t" text-anchor="start">Money</text>
<path d="M332.0 605 L384.0 605" class="linfo" marker-end="url(#d1_info)"/>
<text x="396.0" y="610" class="t" text-anchor="start">Information: lists</text>
<rect x="587.2" y="594" width="34" height="22" rx="5" class="boxacc"/>
<text x="631.2" y="610" class="t" text-anchor="start">Refuser</text>
<text x="40" y="686" class="tcap">A list is a signal: it bites only when a bank, a distributor or a shipper recognises the name and refuses.</text>
</svg>
