rn></defs>
<rect x="0" y="-80" width="1200" height="760" rx="0" class="bg"/><text x="40" y="-34" class="th">Our method</text>
<rect x="40" y="150" width="220" height="84" rx="8" class="box"/>
<text x="150.0" y="187.5" class="tb" text-anchor="middle">Agents explore</text>
<text x="150.0" y="206.5" class="ts" text-anchor="middle">sponsor and public data</text>
<rect x="330" y="150" width="180" height="84" rx="8" class="box"/>
<text x="420.0" y="187.5" class="tb" text-anchor="middle">Leads</text>
<text x="420.0" y="206.5" class="ts" text-anchor="middle">a reason to look</text>
<rect x="580" y="150" width="260" height="84" rx="8" class="boxacc"/>
<text x="710.0" y="178.0" class="tb" text-anchor="middle">Independent skeptic</text>
<text x="710.0" y="197.0" class="ts" text-anchor="middle">re-derives every number</text>
<text x="710.0" y="216.0" class="ts" text-anchor="middle">from the raw data</text>
<rect x="910" y="150" width="260" height="84" rx="8" class="boxacc"/>
<text x="1040.0" y="187.5" class="tb" text-anchor="middle">Official page confirms</text>
<text x="1040.0" y="206.5" class="ts" text-anchor="middle">listing dates and entries</text>
