<rect x="208.0" y="564" width="34" height="22" rx="5" class="boxambs"/>
<text x="252.0" y="580" class="t" text-anchor="start">Error caught today</text>
<text x="40" y="646" class="tcap">Agents find leads cheaply; a separate skeptic and an official page decide what can be shown.</text>
