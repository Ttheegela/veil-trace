<text x="1040.0" y="437.5" class="tb" text-anchor="middle">Receipt</text>
<text x="1040.0" y="456.5" class="ts" text-anchor="middle">source, record, date</text>
<path d="M1040 234 L1040 396" class="ln" marker-end="url(#d5_n)"/>
<rect x="560" y="350" width="270" height="70" rx="8" class="boxpos"/>
<text x="695.0" y="380.5" class="tb" text-anchor="middle">Public slide</text>
<text x="695.0" y="399.5" class="ts" text-anchor="middle">officially listed companies only</text>
<rect x="560" y="460" width="270" height="70" rx="8" class="boxamb"/>
