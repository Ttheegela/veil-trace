<path d="M560 495 L420 495 L420 455 L264 455" class="ln" marker-end="url(#d5_n)"/>
<path d="M150 400 L150 238" class="ln" marker-end="url(#d5_n)"/>
<rect x="584" y="22" width="5" height="82" rx="2" class="famb"/>
<text x="600" y="34" class="tamb" text-anchor="start">Caught: country totals counted twice</text>
<text x="600" y="56" class="ts" text-anchor="start">($52M was really $13.1M)</text>
<text x="600" y="78" class="tamb" text-anchor="start">Caught: 'former' ownership</text>
<text x="600" y="100" class="ts" text-anchor="start">reported as current</text>
<rect x="894" y="22" width="5" height="82" rx="2" class="famb"/>
<text x="910" y="34" class="tamb" text-anchor="start">Caught: sponsor flag said</text>
<text x="910" y="56" class="ts" text-anchor="start">'not sanctioned' for an OFAC-listed firm</text>
<text x="910" y="78" class="tamb" text-anchor="start">Caught: a database start date</text>
<text x="910" y="100" class="ts" text-anchor="start">posing as a listing date</text>
<path d="M710 116 L710 146" class="lamb" marker-end="url(#d5_amb)"/>
<path d="M1040 116 L1040 146" class="lamb" marker-end="url(#d5_amb)"/>
