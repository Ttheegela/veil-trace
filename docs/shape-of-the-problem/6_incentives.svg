.finfo{fill:#7fa8ff}
.frisk{fill:#f2b84b}
.fmfg{fill:#a3b1c6}
.fteal{fill:#4fd1c5}
.facc{fill:#7fa8ff}
.famb{fill:#f2b84b}
.fpos{fill:#4cc98a}
