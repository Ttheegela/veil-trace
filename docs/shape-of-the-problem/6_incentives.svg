<defs><marker id="d6_goods" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L10 5 L0 10 z" class="fgoods"/></marker><marker id="d6_money" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L10 5 L0 10 z" class="fmoney"/></marker><marker id="d6_info" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L10 5 L0 10 z" class="finfo"/></marker><marker id="d6_risk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L10 5 L0 10 z" class="frisk"/></marker><marker id="d6_harm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L10 5 L0 10 z" class="fgoods"/></marker><marker id="d6_n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L10 5 L0 10 z" class="fmfg"/></marker><marker id="d6_acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L10 5 L0 10 z" class="facc"/></marker><marker id="d6_amb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L10 5 L0 10 z" class="famb"/></marker><marker id="d6_teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L10 5 L0 10 z" class="fteal"/></marker><pattern id="d6_hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="9" height="9" class="hatchbg"/><line x1="0" y1="0" x2="0" y2="9" class="hatchln"/></pattern></defs>
<rect x="0" y="-80" width="1200" height="820" rx="0" class="bg"/><text x="40" y="-34" class="th">Who pays, who gains</text>
<rect x="30" y="60" width="280" height="110" rx="8" class="box"/>
<text x="170.0" y="101.0" class="tb" text-anchor="middle">Russian buyers</text>
<text x="170.0" y="120.0" class="ts" text-anchor="middle">pay middlemen</text>
<text x="170.0" y="139.0" class="ts" text-anchor="middle">for the detour</text>
<rect x="460" y="60" width="290" height="110" rx="8" class="box"/>
<text x="605.0" y="101.0" class="tb" text-anchor="middle">Middle firms and hubs</text>
<text x="605.0" y="120.0" class="ts" text-anchor="middle">take a margin;</text>
<text x="605.0" y="139.0" class="ts" text-anchor="middle">a new firm costs little</text>
<rect x="900" y="60" width="270" height="110" rx="8" class="box"/>
<text x="1035.0" y="101.0" class="tb" text-anchor="middle">Makers and distributors</text>
<text x="1035.0" y="120.0" class="ts" text-anchor="middle">want the sale;</text>
<text x="1035.0" y="139.0" class="ts" text-anchor="middle">checking buyers costs money</text>
<path d="M310 115 L456 115" class="lmoney" marker-end="url(#d6_money)"/>
<text x="383" y="104" class="tteal" text-anchor="middle">margin</text>
<path d="M750 115 L896 115" class="lmoney" marker-end="url(#d6_money)"/>
<text x="823" y="104" class="tteal" text-anchor="middle">payment</text>
<rect x="460" y="290" width="290" height="100" rx="8" class="boxacc"/>
<text x="605.0" y="326.0" class="tb" text-anchor="middle">Governments</text>
<text x="605.0" y="345.0" class="ts" text-anchor="middle">need listings that hold up</text>
<text x="605.0" y="364.0" class="ts" text-anchor="middle">in court, so they are slow</text>
<rect x="900" y="290" width="270" height="100" rx="8" class="box"/>
<text x="1035.0" y="326.0" class="tb" text-anchor="middle">Banks</text>
<text x="1035.0" y="345.0" class="ts" text-anchor="middle">fear secondary sanctions:</text>
<text x="1035.0" y="364.0" class="ts" text-anchor="middle">losing access to US dollars</text>
<path d="M750 340 L896 340" class="lrisk" marker-end="url(#d6_risk)"/>
<text x="823" y="328" class="tamb" text-anchor="middle">secondary</text>
<text x="823" y="364" class="tamb" text-anchor="middle">sanctions</text>
<path d="M735 290 L935 176" class="lrisk" marker-end="url(#d6_risk)"/>
<text x="860" y="262" class="tamb" text-anchor="start">fines</text>
<path d="M605 290 L605 176" class="lrisk" marker-end="url(#d6_risk)"/>
<text x="615" y="236" class="tamb" text-anchor="start">lists them, months late</text>
<text x="585" y="550" class="tb" text-anchor="middle">Who bears the cost</text>
<rect x="30" y="490" width="420" height="110" rx="8" class="boxm"/>
<text x="240.0" y="531.0" class="tb" text-anchor="middle">Civilians harmed by the weapons</text>
<text x="240.0" y="550.0" class="ts" text-anchor="middle">foreign chips turn up in Russian</text>
<text x="240.0" y="569.0" class="ts" text-anchor="middle">drones and missiles</text>
<rect x="720" y="490" width="450" height="110" rx="8" class="boxm"/>
<text x="945.0" y="531.0" class="tb" text-anchor="middle">Honest traders and families</text>
<text x="945.0" y="550.0" class="ts" text-anchor="middle">clumsy refusals: medicine exports to Iran</text>
<text x="945.0" y="569.0" class="ts" text-anchor="middle">fell about 35% (2017 to 2023) though exempt</text>
<path d="M170 170 L170 484" class="lharm" marker-end="url(#d6_harm)"/>
<text x="182" y="330" class="t" text-anchor="start">weapons</text>
<path d="M1035 390 L1035 484" class="lharm" marker-end="url(#d6_harm)"/>
<text x="1023" y="450" class="t" text-anchor="end">refuse whole regions</text>
<path d="M40 640 L92 640" class="lmoney" marker-end="url(#d6_money)"/>
<text x="104" y="645" class="t" text-anchor="start">Money</text>
<path d="M186.0 640 L238.0 640" class="lrisk" marker-end="url(#d6_risk)"/>
<text x="250.0" y="645" class="t" text-anchor="start">Risk and pressure</text>
<path d="M432.8 640 L484.8 640" class="lharm" marker-end="url(#d6_harm)"/>
<text x="496.8" y="645" class="t" text-anchor="start">Harm</text>
<rect x="570.4" y="629" width="34" height="22" rx="5" class="boxacc"/>
<text x="614.4" y="645" class="t" text-anchor="start">Sets the rules</text>
<text x="40" y="706" class="tcap">The detour pays the middle, costs the careful, and its harm lands on people far from the deal.</text>
</svg>
