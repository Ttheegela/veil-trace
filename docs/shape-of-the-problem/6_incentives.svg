.tnum{fill:#121b2d}
.box{fill:#121b2d;stroke:#5f6e87}
.boxm{fill:#1a2438;stroke:#5f6e87}
.boxacc{fill:#17274a;stroke:#7fa8ff}
.boxteal{fill:#10302f;stroke:#4fd1c5}
