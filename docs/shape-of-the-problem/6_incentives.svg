<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -80 1200 820" role="img" aria-label="Who pays, who gains. The detour pays the middle, costs the careful, and its harm lands on people far from the deal." font-family='"IBM Plex Sans Variable", "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif'>
<title>Who pays, who gains</title>
<style>
